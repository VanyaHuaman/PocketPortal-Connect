name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify JVM client
        run: ./gradlew build
      - name: Verify macOS scripts
        run: |
          bash -n \
            scripts/connect-macos.sh \
            scripts/pocketportal-connect \
            scripts/install-macos.sh \
            scripts/build-macos-release.sh \
            scripts/test-macos-package.sh
      - name: Verify macOS package
        run: ./scripts/test-macos-package.sh

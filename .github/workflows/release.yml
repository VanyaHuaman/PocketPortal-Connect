name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build and test release archive
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          ./scripts/test-macos-package.sh
          ./scripts/build-macos-release.sh "$version"
          cd build/release
          shasum -a 256 "pocketportal-connect-$version-macos.zip" \
            > "pocketportal-connect-$version-macos.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/release/pocketportal-connect-*-macos.zip \
            build/release/pocketportal-connect-*-macos.zip.sha256 \
            --generate-notes \
            --title "PocketPortal Connect ${GITHUB_REF_NAME}"

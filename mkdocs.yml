# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: PocketPortal Connect
site_description: Securely connect PocketPortal Android devices to Android Studio
site_url: https://vanyahuaman.github.io/PocketPortal-Connect/
repo_url: https://github.com/VanyaHuaman/PocketPortal-Connect
repo_name: VanyaHuaman/PocketPortal-Connect

theme:
  name: material
  logo: assets/pocketportal-mark.svg
  favicon: assets/pocketportal-mark.svg
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    scheme: slate
    primary: custom
    accent: custom

extra_css:
  - stylesheets/pocketportal.css

nav:
  - Home: index.md
  - Install & connect: getting-started/installation.md
  - Terminal interface: terminal-interface.md
  - Managed Macs & TLS: managed-macs.md
  - Troubleshooting: troubleshooting.md
  - Bridge contract: bridge-contract.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

plugins:
  - search
  - glightbox

strict: true
